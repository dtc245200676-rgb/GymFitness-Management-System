name: gym-fitness
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gym_fitness
      MYSQL_USER: gym_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
    - mysql_data:/var/lib/mysql
    networks:
    - backend_net
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -u root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports:
    - 127.0.0.1:8081:80
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
    - backend_net
  app:
    build: ./backend
    restart: unless-stopped
    ports:
    - 127.0.0.1:3001:3000
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_NAME: gym_fitness
      DB_USER: gym_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
    - frontend_net
    - backend_net
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
    - 127.0.0.1:8088:80
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    - ./nginx/metrics.conf:/etc/nginx/conf.d/metrics.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
    - frontend_net
    - monitor_net
    security_opt:
    - no-new-privileges:true
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    restart: unless-stopped
    command:
    - --housekeeping_interval=30s
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    networks:
    - monitor_net
    security_opt:
    - no-new-privileges:true
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    command:
    - --nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
    - nginx
    networks:
    - monitor_net
    security_opt:
    - no-new-privileges:true
  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command:
    - --mysqld.address=mysql:3306
    - --mysqld.username=gym_exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Them MYSQL_EXPORTER_PASSWORD vao .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
    - backend_net
    - monitor_net
    security_opt:
    - no-new-privileges:true
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
    - 127.0.0.1:9091:9090
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=3d
    volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    networks:
    - monitor_net
    security_opt:
    - no-new-privileges:true
  grafana:
    image: grafana/grafana:13.2.2-slim
    restart: unless-stopped
    ports:
    - 127.0.0.1:3002:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Them GRAFANA_ADMIN_PASSWORD vao .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
    - monitor_net
    security_opt:
    - no-new-privileges:true
  loki-init:
    image: busybox:1.36
    user: 0:0
    restart: 'no'
    command:
    - sh
    - -c
    - chown -R 10001:10001 /data
    volumes:
    - loki_data:/data
    networks:
    - monitor_net
    security_opt:
    - no-new-privileges:true
  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command:
    - -config.file=/etc/loki/local-config.yaml
    ports:
    - 127.0.0.1:3101:3100
    volumes:
    - ./loki/config.yml:/etc/loki/local-config.yaml:ro
    - loki_data:/tmp/loki
    depends_on:
      loki-init:
        condition: service_completed_successfully
    networks:
    - monitor_net
    security_opt:
    - no-new-privileges:true
  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped
    command:
    - -config.file=/etc/promtail/config.yml
    volumes:
    - ./promtail/config.yml:/etc/promtail/config.yml:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
    - loki
    networks:
    - monitor_net
    security_opt:
    - no-new-privileges:true
volumes:
  mysql_data: null
  prometheus_data: null
  grafana_data: null
  loki_data: null
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitor_net:
    driver: bridge
